<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2450" viewBox="0 0 1200 2450" role="img" aria-labelledby="title desc"><title id="title">Comfy Telegram Pipeline: from bot to final video</title><desc id="desc">Setup, diagnostics, generation, approval or rejection, interpolation, upscale, publication, and checkpoint-based failure recovery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#059669" /></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc2626" /></marker></defs><rect width="1200" height="2450" fill="#f1f5f9" /><rect width="1200" height="185" fill="#0f172a" /><text x="55" y="65" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700" fill="#fff">COMFY TELEGRAM PIPELINE</text><text x="55" y="110" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#cbd5e1">From first frame to final clip — with approval and recovery</text><text x="55" y="151" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#93c5fd">TELEGRAM  /  N8N  /  COMFY  /  FILM  /  REAL-ESRGAN</text><rect x="55" y="220" width="340" height="155" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="238" width="5" height="119" rx="2" fill="#2563eb" /><text x="79" y="258" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">PREPARE</text><text x="79" y="293" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Separate code from runtime</text><text x="79" y="321" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Models + custom nodes</text><text x="79" y="349" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Keep credentials local</text><rect x="430" y="220" width="340" height="155" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="430" y="238" width="5" height="119" rx="2" fill="#2563eb" /><text x="454" y="258" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">CONFIGURE</text><text x="454" y="293" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Match mounts and paths</text><text x="454" y="321" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Authorized user + HTTPS</text><text x="454" y="349" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Independent test bot</text><rect x="805" y="220" width="340" height="155" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="805" y="238" width="5" height="119" rx="2" fill="#2563eb" /><text x="829" y="258" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">VERIFY</text><text x="829" y="293" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Health + nodes + mounts</text><text x="829" y="321" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Host and container → Comfy</text><text x="829" y="349" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Check before publishing</text><path d="M400 298 L423 298" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="423,298 412.0,303.0 412.0,293.0" fill="#64748b" /><path d="M775 298 L798 298" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="798,298 787.0,303.0 787.0,293.0" fill="#64748b" /><rect x="55" y="415" width="1090" height="125" rx="20" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" /><text x="80" y="453" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#075985">BEFORE THE FIRST JOB</text><text x="80" y="489" font-family="DejaVu Sans, sans-serif" font-size="18.8" font-weight="400" fill="#075985">Verify key, boot, paths and finalizer • One supervisor per shared state</text><text x="80" y="519" font-family="DejaVu Sans, sans-serif" font-size="19.1" font-weight="400" fill="#0c4a6e">Diagnostics query services; they do not prove available RAM/VRAM.</text><text x="55" y="583" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#2563eb">NORMAL FLOW</text><text x="790" y="583" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#64748b">DECISIONS &amp; FAILURES</text><rect x="55" y="610" width="670" height="115" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="628" width="5" height="79" rx="2" fill="#2563eb" /><text x="79" y="648" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">01  OPEN THE BOT</text><text x="79" y="683" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/start → New Video or /generate</text><text x="79" y="711" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">A guided draft, without writing JSON.</text><rect x="55" y="765" width="670" height="115" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="783" width="5" height="79" rx="2" fill="#2563eb" /><text x="79" y="803" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">02  DEFINE YOUR VIDEO</text><text x="79" y="838" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">First frame → 9:16 or 16:9 → 2/4/6/8s</text><text x="79" y="866" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Prompt → negative → review → Generate.</text><rect x="55" y="920" width="670" height="115" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="938" width="5" height="79" rx="2" fill="#2563eb" /><text x="79" y="958" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">03  REGISTER &amp; QUEUE</text><text x="79" y="993" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">n8n records the request and controls its slot.</text><text x="79" y="1021" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Initial acceptance is not a finished video.</text><rect x="55" y="1075" width="670" height="115" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="1093" width="5" height="79" rx="2" fill="#2563eb" /><text x="79" y="1113" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">04  GENERATE LTX PREVIEW</text><text x="79" y="1148" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">30 FPS generation at half dimensions.</text><text x="79" y="1176" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Save a checkpoint; send a preview for review.</text><rect x="55" y="1230" width="670" height="125" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="1248" width="5" height="89" rx="2" fill="#2563eb" /><text x="79" y="1268" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">05  WAIT FOR YOUR DECISION</text><text x="79" y="1303" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Open the private form on your phone.</text><text x="79" y="1331" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Approve or reject; wait state saved in the DB.</text><rect x="55" y="1480" width="670" height="110" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="1498" width="5" height="74" rx="2" fill="#059669" /><text x="79" y="1518" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">06  INTERPOLATE</text><text x="79" y="1553" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">FILM 2× → 60 FPS</text><text x="79" y="1581" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Audio remains connected.</text><rect x="55" y="1630" width="670" height="120" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="1648" width="5" height="84" rx="2" fill="#059669" /><text x="79" y="1668" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">07  UPSCALE</text><text x="79" y="1703" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">RealESRGAN x2 • 8 frames per batch</text><text x="79" y="1731" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">VHS may requeue chunks of the same clip.</text><rect x="55" y="1790" width="670" height="110" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="1808" width="5" height="74" rx="2" fill="#059669" /><text x="79" y="1828" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">08  PUBLISH THE FILE</text><text x="79" y="1863" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Finalizer verifies and publishes safely.</text><text x="79" y="1891" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Write receipt and finish postprocessing.</text><rect x="55" y="1940" width="670" height="120" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="55" y="1958" width="5" height="84" rx="2" fill="#059669" /><text x="79" y="1978" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#0f172a">09  RECEIVE COMPLETION</text><text x="79" y="2013" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">media/final/REQUEST_ID.mp4</text><text x="79" y="2041" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Final notice; no second approval.</text><path d="M390 731 L390 751" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="390,751 385.0,740.0 395.0,740.0" fill="#64748b" /><path d="M390 886 L390 906" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="390,906 385.0,895.0 395.0,895.0" fill="#64748b" /><path d="M390 1041 L390 1061" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="390,1061 385.0,1050.0 395.0,1050.0" fill="#64748b" /><path d="M390 1196 L390 1216" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="390,1216 385.0,1205.0 395.0,1205.0" fill="#64748b" /><path d="M390 1361 L390 1466" fill="none" stroke="#059669" stroke-width="3" /><polygon points="390,1466 385.0,1455.0 395.0,1455.0" fill="#059669" /><text x="407" y="1421" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#047857">APPROVE</text><path d="M390 1596 L390 1616" fill="none" stroke="#059669" stroke-width="3" /><polygon points="390,1616 385.0,1605.0 395.0,1605.0" fill="#059669" /><path d="M390 1756 L390 1776" fill="none" stroke="#059669" stroke-width="3" /><polygon points="390,1776 385.0,1765.0 395.0,1765.0" fill="#059669" /><path d="M390 1906 L390 1926" fill="none" stroke="#059669" stroke-width="3" /><polygon points="390,1926 385.0,1915.0 395.0,1915.0" fill="#059669" /><rect x="790" y="610" width="355" height="165" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="628" width="5" height="129" rx="2" fill="#2563eb" /><text x="814" y="648" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#0f172a">MONITOR</text><text x="814" y="683" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/status or /queue</text><text x="814" y="711" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">View job, stage and queue.</text><text x="814" y="739" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Avoid repeated clicks.</text><rect x="790" y="850" width="355" height="150" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="868" width="5" height="114" rx="2" fill="#dc2626" /><text x="814" y="888" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#0f172a">TECHNICAL FAILURE</text><text x="814" y="923" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">HTTP, model, memory,</text><text x="814" y="951" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">file or notification.</text><text x="814" y="979" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Inspect the incident.</text><path d="M725 1131 L750 1131" fill="none" stroke="#dc2626" stroke-width="3" /><polygon points="750,1131 739.0,1136.0 739.0,1126.0" fill="#dc2626" /><path d="M750 1131 L750 925 L780 925" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red)" /><rect x="790" y="1040" width="355" height="140" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="1058" width="5" height="104" rx="2" fill="#dc2626" /><text x="814" y="1078" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#0f172a">ERROR HANDLER</text><text x="814" y="1113" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Record err-EXECUTION.</text><text x="814" y="1141" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Classify; assess reservation.</text><text x="814" y="1169" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Controlled alert delivery.</text><path d="M967 1008 L967 1032" fill="none" stroke="#dc2626" stroke-width="3" /><polygon points="967,1032 962.0,1021.0 972.0,1021.0" fill="#dc2626" /><rect x="790" y="1220" width="355" height="160" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="1238" width="5" height="124" rx="2" fill="#d97706" /><text x="814" y="1258" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#0f172a">SUPERVISOR</text><text x="814" y="1293" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/recover and checkpoints.</text><text x="814" y="1321" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Wait for safe conditions.</text><text x="814" y="1349" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Do not duplicate uncertain work.</text><path d="M967 1186 L967 1212" fill="none" stroke="#64748b" stroke-width="3" /><polygon points="967,1212 962.0,1201.0 972.0,1201.0" fill="#64748b" /><rect x="790" y="1440" width="355" height="160" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="1458" width="5" height="124" rx="2" fill="#d97706" /><text x="814" y="1478" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#0f172a">REJECT PREVIEW</text><text x="814" y="1513" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">No interpolation/upscale.</text><text x="814" y="1541" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/draft or /retry REQUEST_ID</text><text x="814" y="1569" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Edit and confirm again.</text><path d="M725 1290 L765 1290 L765 1510 L780 1510" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)" /><path d="M1145 1525 L1172 1525 L1172 820 L1145 820 L1145 815 L735 815" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)" /><rect x="790" y="1660" width="355" height="255" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="1678" width="5" height="219" rx="2" fill="#475569" /><text x="814" y="1698" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#0f172a">CONTROLS</text><text x="814" y="1733" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/cancel: close the editor</text><text x="814" y="1761" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/clear: clean the list</text><text x="814" y="1789" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/delete: eligible files</text><text x="814" y="1817" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">/stop: entire Comfy queue</text><text x="814" y="1845" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Wait for confirmation.</text><rect x="790" y="1950" width="355" height="110" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2" /><rect x="790" y="1968" width="5" height="74" rx="2" fill="#d97706" /><text x="814" y="1988" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#0f172a">INCIDENT ALERT</text><text x="814" y="2023" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Supervisor retries delivery.</text><text x="814" y="2051" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#334155">Same incident; no GPU work.</text><rect x="55" y="2110" width="1090" height="280" rx="20" fill="#0f172a" stroke="#0f172a" stroke-width="2" /><text x="80" y="2154" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#fff">FOLDERS &amp; KEY CHECKS</text><text x="80" y="2196" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">repos/ → public code     services/ → private configuration and state</text><text x="80" y="2232" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">media/current → images     media/final → MP4 files and receipts</text><text x="80" y="2268" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">models/ and output/ → outside Git     .telegram-ui/ → never publish</text><text x="80" y="2315" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#fde68a">A timeout is not proof of GPU failure. Never delete reservations to force resubmission.</text><text x="80" y="2351" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#93c5fd">Two schedules are expected: job recovery and incident alert delivery.</text><text x="55" y="2425" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#64748b">Operator guide • Read docs/TUTORIAL.md before configuring or publishing.</text><polygon points="780,925 768,919 768,931" fill="#dc2626" /><polygon points="780,1510 768,1504 768,1516" fill="#d97706" /><polygon points="735,815 747,809 747,821" fill="#d97706" /></svg>
